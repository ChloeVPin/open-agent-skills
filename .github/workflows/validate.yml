name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-and-links:
    name: Frontmatter spec, links, sections, and citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent Skills spec validation (name, description, charset, lengths)
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            npx --yes skills-ref validate "$f" > /dev/null 2>&1 || {
              echo "SPEC FAIL: $f"
              npx --yes skills-ref validate "$f" || true
              fail=1
            }
          done
          if [ $fail -ne 0 ]; then echo "Spec validation failed for one or more skills"; fi
          exit $fail

      - name: Check local links resolve and external URLs are well-formed
        run: |
          python3 - <<'EOF'
          import pathlib, re, urllib.parse, sys
          fail = 0
          md_files = list(pathlib.Path("docs").glob("*.md")) + list(pathlib.Path("skills").glob("*/SKILL.md")) + [pathlib.Path("README.md")]
          for f in md_files:
              text = f.read_text()
              for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  link = m.group(1).strip()
                  if link.startswith(("http://", "https://")):
                      if not link.startswith("https://"):
                          print(f"NON-HTTPS external link in {f}: {link}")
                          fail = 1
                      continue
                  if link.startswith("#") or link.startswith("mailto:"):
                      continue
                  # relative markdown link (strip anchor)
                  target = link.split("#")[0]
                  if not target:
                      continue
                  resolved = (f.parent / target).resolve()
                  if not resolved.exists():
                      print(f"BROKEN local link in {f}: {link} -> {resolved}")
                      fail = 1
          print("links: OK" if fail == 0 else "links: FAILED")
          sys.exit(fail)
          EOF

      - name: Required sections present in every skill
        run: |
          required=(
            "Purpose and scope"
            "Triggers and prerequisites"
            "Decision criteria"
            "Procedure"
            "Examples and counterexamples"
            "Failure modes and recovery"
            "Validation evidence and provenance"
            "Related skills and conflicts"
          )
          fail=0
          for f in skills/*/SKILL.md; do
            for section in "${required[@]}"; do
              if ! grep -qF "## $section" "$f"; then
                echo "MISSING '## $section' in $f"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Provenance sections cite the central research base
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            if ! grep -q 'docs/research.md' "$f"; then
              echo "MISSING research-base citation in $f"
              fail=1
            fi
          done
          exit $fail

      - name: No anonymous 'governing research' attributions
        run: |
          # Match actual anonymous attribution usage, not the skill-quality-review
          # guard that names the phrase as something to reject.
          if grep -rE 'governing research (emphasizes|requires|report|is)' skills/; then
            echo "FAIL: anonymous 'governing research' attribution found"
            exit 1
          fi
          echo "no anonymous attributions"

      - name: Every cited finding ID resolves in docs/research.md
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          research = pathlib.Path("docs/research.md").read_text()
          defined = set(re.findall(r'^### ([FCQS]\d+)\.', research, flags=re.M))
          fail = 0
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = f.read_text()
              cited = set(re.findall(r'\b([FCQS]\d+)\b', text))
              # ignore IDs in the docs link path itself (they are the defined set) — all cited IDs must be defined
              dangling = cited - defined
              if dangling:
                  print(f"UNDEFINED finding IDs in {f}: {sorted(dangling)}")
                  fail = 1
          if not defined:
              print("No finding headers found in docs/research.md")
              sys.exit(1)
          print(f"defined findings: {len(defined)}; dangling: none" if fail == 0 else "dangling found")
          sys.exit(fail)
          EOF

      - name: Lifecycle status is declared and lowercase
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            if ! grep -qE '^Lifecycle: `(draft|verified|deprecated)`' "$f"; then
              echo "BAD lifecycle in $f"
              fail=1
            fi
          done
          exit $fail
